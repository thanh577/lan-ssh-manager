name: Build LAN SSH Manager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 1.2.5)'
        required: true
        type: string

permissions:
  contents: write

env:
  VER: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3 python3-venv python3-pip curl

      - name: Build .deb package
        run: |
          chmod +x scripts/package.sh
          bash scripts/package.sh
        env:
          VER: ${{ env.VER }}

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-ssh-manager-deb
          path: ssh_manager/lan-ssh-manager_${{ env.VER }}_amd64.deb

      - name: Release .deb
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ssh_manager/lan-ssh-manager_${{ env.VER }}_amd64.deb
          generate_release_notes: true

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip curl file fuse libfuse2

      - name: Build AppImage
        run: |
          chmod +x scripts/package.sh
          bash scripts/package.sh
        env:
          VER: ${{ env.VER }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-ssh-manager-appimage
          path: ssh_manager/LAN-SSH-Manager-${{ env.VER }}-x86_64.AppImage

      - name: Release AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ssh_manager/LAN-SSH-Manager-${{ env.VER }}-x86_64.AppImage
          generate_release_notes: true

  build-exe:
    name: Build Windows EXE
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Build Windows EXE
        run: |
          scripts\build_exe.bat
        env:
          VER: ${{ env.VER }}

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: lan-ssh-manager-exe
          path: ssh_manager/LAN-SSH-Manager-win64-${{ env.VER }}.exe

      - name: Release Windows EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ssh_manager/LAN-SSH-Manager-win64-${{ env.VER }}.exe
          generate_release_notes: true