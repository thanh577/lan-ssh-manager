# Build file .exe Windows độc lập trên máy ảo của GitHub (không cần máy Windows).
#
# Cách dùng (sau khi push file này lên GitHub):
#   1. Mở repo → tab Actions → "Build Windows exe" → Run workflow → Run.
#   2. Đợi ~5-10 phút cho job chạy xong (xanh).
#   3. Kéo xuống mục Artifacts → tải LAN-SSH-Manager-win64-<VER>.exe về.
#
# Job làm 2 việc: test headless (start → health → stop) rồi mới đóng exe,
# nên exe lỗi là job báo đỏ ngay, không phải tải về mới biết.
name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (vd 1.2.4)'
        required: true
        default: '1.2.4'
  push:
    tags:
      - 'win-v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "${{ github.ref_name }}".Replace('win-v','') }
          if ([string]::IsNullOrWhiteSpace($ver)) { $ver = "1.2.4" }
          "VER=$ver" >> $env:GITHUB_ENV
          "EXE_NAME=LAN-SSH-Manager-win64-$ver.exe" >> $env:GITHUB_ENV

      - name: Install deps
        run: |
          python -m pip install -U pip
          pip install -r backend/requirements.txt pyinstaller

      - name: Headless selftest (start/health/stop)
        run: python gui/app_win.py --selftest-headless --port 8129
        env:
          LAN_SSH_DATA: ${{ runner.temp }}\lsm-test

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "$($env:EXE_NAME -replace '\.exe$','')" `
            --paths . `
            --add-data "frontend;frontend" `
            --add-data ".env.example;." `
            --collect-all uvicorn `
            --collect-all asyncssh `
            --copy-metadata asyncssh `
            --copy-metadata uvicorn `
            gui/app_win.py
          Copy-Item "dist\$env:EXE_NAME" -Destination "$env:EXE_NAME"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXE_NAME }}
          path: ${{ env.EXE_NAME }}
